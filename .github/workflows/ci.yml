name: CI and container release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate-infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate development stack
        run: >-
          docker compose
          --env-file infra/environments/.env.dev.example
          -f infra/compose/compose.dev.yml
          config --quiet

      - name: Validate test stack
        run: docker compose -f infra/compose/compose.test.yml config --quiet

      - name: Validate observability overlay
        run: >-
          docker compose
          --env-file infra/environments/.env.dev.example
          --env-file infra/environments/.env.observability.example
          -f infra/compose/compose.dev.yml
          -f infra/compose/compose.observability.yml
          config --quiet

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-core/pom.xml

      - name: Start ephemeral dependencies
        run: docker compose -f infra/compose/compose.test.yml up -d --wait --wait-timeout 120

      - name: Run Maven tests
        working-directory: backend-core
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:55433/payment_gateway_test
          SPRING_DATASOURCE_USERNAME: gateway_test
          SPRING_DATASOURCE_PASSWORD: gateway_test_password
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "56379"
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: "55672"
          SPRING_RABBITMQ_USERNAME: gateway_test
          SPRING_RABBITMQ_PASSWORD: gateway_test_password
          SPRING_RABBITMQ_VIRTUAL_HOST: payment_gateway_test
          GATEWAY_VAULT_KEY: ZGV2ZWxvcG1lbnQtb25seS12YXVsdC1rZXktMzIhISE=
          GATEWAY_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Stop ephemeral dependencies
        if: always()
        run: docker compose -f infra/compose/compose.test.yml down --volumes --remove-orphans

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-portal/package-lock.json

      - name: Install dependencies
        working-directory: frontend-portal
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend-portal
        run: npx prisma generate

      - name: Lint
        working-directory: frontend-portal
        run: npm run lint

      - name: Build
        working-directory: frontend-portal
        env:
          DATABASE_URL: postgresql://gateway_test:gateway_test_password@localhost:55433/payment_gateway_test
        run: npm run build

  image-security:
    name: Build and scan ${{ matrix.name }}
    needs: [validate-infrastructure, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-core
            dockerfile: infra/docker/backend.Dockerfile
          - name: frontend-portal
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          echo "ref=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build scan candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  publish-images:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-core
            dockerfile: infra/docker/backend.Dockerfile
          - name: frontend-portal
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          echo "ref=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
