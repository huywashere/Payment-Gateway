name: CI and container release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate-infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate development stack
        run: >-
          docker compose
          --env-file infra/environments/.env.dev.example
          -f infra/compose/compose.dev.yml
          config --quiet

      - name: Validate test stack
        run: docker compose -f infra/compose/compose.test.yml config --quiet

      - name: Validate observability overlay
        run: >-
          docker compose
          --env-file infra/environments/.env.dev.example
          --env-file infra/environments/.env.observability.example
          -f infra/compose/compose.dev.yml
          -f infra/compose/compose.observability.yml
          config --quiet

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-core/pom.xml

      - name: Start ephemeral dependencies
        run: docker compose -f infra/compose/compose.test.yml up -d --wait --wait-timeout 120

      - name: Run Maven tests
        working-directory: backend-core
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:55433/payment_gateway_test
          SPRING_DATASOURCE_USERNAME: gateway_test
          SPRING_DATASOURCE_PASSWORD: gateway_test_password
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: "56379"
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: "55672"
          SPRING_RABBITMQ_USERNAME: gateway_test
          SPRING_RABBITMQ_PASSWORD: gateway_test_password
          SPRING_RABBITMQ_VIRTUAL_HOST: payment_gateway_test
          GATEWAY_VAULT_KEY: ZGV2ZWxvcG1lbnQtb25seS12YXVsdC1rZXktMzIhISE=
          GATEWAY_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Stop ephemeral dependencies
        if: always()
        run: docker compose -f infra/compose/compose.test.yml down --volumes --remove-orphans

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-portal/package-lock.json

      - name: Install dependencies
        working-directory: frontend-portal
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend-portal
        run: npx prisma generate

      - name: Lint
        working-directory: frontend-portal
        run: npm run lint

      - name: Build
        working-directory: frontend-portal
        env:
          DATABASE_URL: postgresql://gateway_test:gateway_test_password@localhost:55433/payment_gateway_test
        run: npm run build

  image-security:
    name: Build and scan ${{ matrix.name }}
    needs: [validate-infrastructure, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-core
            dockerfile: infra/docker/backend.Dockerfile
          - name: frontend-portal
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          echo "ref=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build scan candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Enforce vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}:ci-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  publish-images:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-core
            dockerfile: infra/docker/backend.Dockerfile
          - name: frontend-portal
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          echo "ref=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
