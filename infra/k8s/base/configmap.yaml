apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-gateway-config
data:
  SPRING_PROFILES_ACTIVE: production
  GATEWAY_MODE: live
  GATEWAY_PROCESSOR_MODE: live
  GATEWAY_PLATFORM_AUTH_MODE: oidc
  GATEWAY_VAULT_PROVIDER: kms
  GATEWAY_KMS_ADAPTER: placeholder
  GATEWAY_WEBHOOK_DELIVERY_ENABLED: "true"
  GATEWAY_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS: "false"
  GATEWAY_WEBHOOK_REQUIRE_HTTPS: "true"
  GATEWAY_RATE_LIMIT_ENABLED: "true"
  GATEWAY_RATE_LIMIT_FAIL_OPEN: "false"
  GATEWAY_EXTERNAL_CONTROLS_ATTESTED: "true"
  SPRING_REDIS_SSL_ENABLED: "true"
  SPRING_RABBITMQ_SSL_ENABLED: "true"
  PORTAL_AUTH_MODE: oidc
  PORTAL_OIDC_REQUIRE_MFA: "true"
  PORTAL_SECURE_COOKIES: "true"
  GATEWAY_CORE_URL: http://backend:8080
