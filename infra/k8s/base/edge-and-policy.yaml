apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-gateway
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portal.payments.example.com, api.payments.example.com]
      secretName: payment-gateway-tls
  rules:
    - host: portal.payments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    - host: api.payments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-traffic
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [payment-backend, payment-frontend] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector: { matchLabels: { app: payment-frontend } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 3000 }
    - from:
        - podSelector: { matchLabels: { monitoring: prometheus } }
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 5671 }
