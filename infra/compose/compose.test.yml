name: payment-gateway-test

services:
  postgres-test:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: payment_gateway_test
      POSTGRES_USER: gateway_test
      POSTGRES_PASSWORD: gateway_test_password
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_test -d payment_gateway_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gateway_test
      RABBITMQ_DEFAULT_PASS: gateway_test_password
      RABBITMQ_DEFAULT_VHOST: payment_gateway_test
    ports:
      - "127.0.0.1:${TEST_RABBITMQ_HOST_PORT:-55672}:5672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
