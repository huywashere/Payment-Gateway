name: payment-gateway-dev

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_dev_password}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-gateway_dev_redis_password}"]
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gateway_dev_redis_password}
    restart: unless-stopped
    networks: [data]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gateway_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gateway_dev_rabbit_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-payment_gateway_dev}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks: [data]

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: payment-gateway/backend-core:dev
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payment_gateway}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gateway_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gateway_dev_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-gateway_dev_redis_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-gateway_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gateway_dev_rabbit_password}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-payment_gateway_dev}
      GATEWAY_VAULT_KEY: ${GATEWAY_VAULT_KEY:-ZGV2ZWxvcG1lbnQtb25seS12YXVsdC1rZXktMzIhISE=}
      GATEWAY_VAULT_PROVIDER: ${GATEWAY_VAULT_PROVIDER:-environment}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000}
      GATEWAY_MODE: ${GATEWAY_MODE:-sandbox}
      GATEWAY_PROCESSOR_MODE: ${GATEWAY_PROCESSOR_MODE:-mock}
      BANK_SANDBOX_CLIENT_ID: ${BANK_SANDBOX_CLIENT_ID:-project-client}
      BANK_SANDBOX_CLIENT_SECRET: ${BANK_SANDBOX_CLIENT_SECRET:-project-secret}
      BANK_SANDBOX_CALLBACK_SECRET: ${BANK_SANDBOX_CALLBACK_SECRET:-project-callback-secret}
      BANK_SANDBOX_DEFAULT_BANK: ${BANK_SANDBOX_DEFAULT_BANK:-ACB}
      ACB_SANDBOX_CLIENT_ID: ${ACB_SANDBOX_CLIENT_ID:-}
      ACB_SANDBOX_CLIENT_SECRET: ${ACB_SANDBOX_CLIENT_SECRET:-}
      ACB_SANDBOX_CALLBACK_SECRET: ${ACB_SANDBOX_CALLBACK_SECRET:-}
      BIDV_SANDBOX_CLIENT_ID: ${BIDV_SANDBOX_CLIENT_ID:-}
      BIDV_SANDBOX_CLIENT_SECRET: ${BIDV_SANDBOX_CLIENT_SECRET:-}
      BIDV_SANDBOX_CALLBACK_SECRET: ${BIDV_SANDBOX_CALLBACK_SECRET:-}
      VIETINBANK_SANDBOX_CLIENT_ID: ${VIETINBANK_SANDBOX_CLIENT_ID:-}
      VIETINBANK_SANDBOX_CLIENT_SECRET: ${VIETINBANK_SANDBOX_CLIENT_SECRET:-}
      VIETINBANK_SANDBOX_CALLBACK_SECRET: ${VIETINBANK_SANDBOX_CALLBACK_SECRET:-}
      NCB_SANDBOX_CLIENT_ID: ${NCB_SANDBOX_CLIENT_ID:-}
      NCB_SANDBOX_CLIENT_SECRET: ${NCB_SANDBOX_CLIENT_SECRET:-}
      NCB_SANDBOX_CALLBACK_SECRET: ${NCB_SANDBOX_CALLBACK_SECRET:-}
      GATEWAY_PLATFORM_ADMIN_KEY: ${GATEWAY_PLATFORM_ADMIN_KEY:-platform_dev_admin_change_me}
      GATEWAY_WEBHOOK_DELIVERY_ENABLED: ${GATEWAY_WEBHOOK_DELIVERY_ENABLED:-false}
      GATEWAY_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS: ${GATEWAY_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS:-true}
      GATEWAY_WEBHOOK_REQUIRE_HTTPS: ${GATEWAY_WEBHOOK_REQUIRE_HTTPS:-false}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-false}
      GATEWAY_RATE_LIMIT_FAIL_OPEN: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:-true}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks: [app, data]

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    image: payment-gateway/frontend-portal:dev
    environment:
      GATEWAY_CORE_URL: http://backend:8080
      GATEWAY_DEMO_SECRET_KEY: ${GATEWAY_DEMO_SECRET_KEY:-sk_test_demo_gateway_key_999}
      GATEWAY_SANDBOX_SECRET_KEY: ${GATEWAY_SANDBOX_SECRET_KEY:-sk_test_demo_gateway_key_999}
      GATEWAY_MODE: ${GATEWAY_MODE:-sandbox}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:-development-session-secret-change-me-32chars}
      PORTAL_AUTH_MODE: ${PORTAL_AUTH_MODE:-demo}
      PORTAL_DEMO_PASSWORD: ${PORTAL_DEMO_PASSWORD:-ProjectDemo!2026}
      PORTAL_DEMO_MFA_CODE: ${PORTAL_DEMO_MFA_CODE:-246810}
      PORTAL_SECURE_COOKIES: ${PORTAL_SECURE_COOKIES:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gateway_user}:${POSTGRES_PASSWORD:-gateway_dev_password}@postgres:5432/${POSTGRES_DB:-payment_gateway}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks: [edge, app, data]

  infra-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/infra-gateway.Dockerfile
    image: payment-gateway/infra-gateway:dev
    environment:
      INFRA_GATEWAY_ADDR: :8090
      GATEWAY_CORE_URL: http://backend:8080
      GATEWAY_CORE_SECRET_KEY: ${GATEWAY_SANDBOX_SECRET_KEY:-sk_test_demo_gateway_key_999}
      INFRA_INGEST_SECRET: ${INFRA_INGEST_SECRET:-sandbox-infra-ingest-secret}
      INFRA_WORKERS: ${INFRA_WORKERS:-8}
      INFRA_QUEUE_SIZE: ${INFRA_QUEUE_SIZE:-2048}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATEWAY_HOST_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/infra-gateway-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [edge, app]

networks:
  edge:
  app:
  data:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
