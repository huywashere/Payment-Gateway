spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:true}
      timeout: 3000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GATEWAY_PLATFORM_OIDC_ISSUER}

gateway:
  mode: ${GATEWAY_MODE:live}
  processor:
    mode: ${GATEWAY_PROCESSOR_MODE:live}
    live-adapter: ${GATEWAY_LIVE_PROCESSOR_ADAPTER:placeholder}
    live-payout-adapter: ${GATEWAY_LIVE_PAYOUT_ADAPTER:placeholder}
  production:
    external-controls-attested: ${GATEWAY_EXTERNAL_CONTROLS_ATTESTED:false}
  security:
    card-vault-master-key: ${GATEWAY_VAULT_KEY:}
    vault-provider: ${GATEWAY_VAULT_PROVIDER:kms}
    kms-adapter: ${GATEWAY_KMS_ADAPTER:placeholder}
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS}
    platform-admin-key: ${GATEWAY_PLATFORM_ADMIN_KEY:}
    platform-auth-mode: ${GATEWAY_PLATFORM_AUTH_MODE:oidc}
  webhooks:
    delivery-enabled: ${GATEWAY_WEBHOOK_DELIVERY_ENABLED:true}
    allow-private-endpoints: false
    require-https: true
    store-response-body: false
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:false}

server:
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 30s
    max-keep-alive-requests: 100

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
