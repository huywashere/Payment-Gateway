server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-gateway-core
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        multiplier: 2.0
        max-attempts: 3

# Gateway Custom Configurations
gateway:
  mode: ${GATEWAY_MODE:sandbox}
  acquirer:
    mode: ${GATEWAY_ACQUIRER_MODE:sandbox}
    live-adapter: ${GATEWAY_LIVE_ACQUIRER_ADAPTER:placeholder}
  processor:
    mode: ${GATEWAY_PROCESSOR_MODE:mock}
    live-adapter: ${GATEWAY_LIVE_PROCESSOR_ADAPTER:placeholder}
    live-payout-adapter: ${GATEWAY_LIVE_PAYOUT_ADAPTER:placeholder}
    sandbox-client-id: ${BANK_SANDBOX_CLIENT_ID:project-client}
    sandbox-client-secret: ${BANK_SANDBOX_CLIENT_SECRET:project-secret}
    sandbox-callback-secret: ${BANK_SANDBOX_CALLBACK_SECRET:project-callback-secret}
    default-bank: ${BANK_SANDBOX_DEFAULT_BANK:ACB}
    banks:
      acb:
        client-id: ${ACB_SANDBOX_CLIENT_ID:}
        client-secret: ${ACB_SANDBOX_CLIENT_SECRET:}
        callback-secret: ${ACB_SANDBOX_CALLBACK_SECRET:}
      bidv:
        client-id: ${BIDV_SANDBOX_CLIENT_ID:}
        client-secret: ${BIDV_SANDBOX_CLIENT_SECRET:}
        callback-secret: ${BIDV_SANDBOX_CALLBACK_SECRET:}
      vietinbank:
        client-id: ${VIETINBANK_SANDBOX_CLIENT_ID:}
        client-secret: ${VIETINBANK_SANDBOX_CLIENT_SECRET:}
        callback-secret: ${VIETINBANK_SANDBOX_CALLBACK_SECRET:}
      ncb:
        client-id: ${NCB_SANDBOX_CLIENT_ID:}
        client-secret: ${NCB_SANDBOX_CLIENT_SECRET:}
        callback-secret: ${NCB_SANDBOX_CALLBACK_SECRET:}
  security:
    platform-admin-key: ${GATEWAY_PLATFORM_ADMIN_KEY:}
    platform-auth-mode: ${GATEWAY_PLATFORM_AUTH_MODE:key}
    vault-provider: ${GATEWAY_VAULT_PROVIDER:environment}
    kms-adapter: ${GATEWAY_KMS_ADAPTER:placeholder}
  production:
    external-controls-attested: ${GATEWAY_EXTERNAL_CONTROLS_ATTESTED:false}
  fee:
    fixed-fee-vnd: ${GATEWAY_FIXED_FEE_VND:2000}
    percentage-fee: ${GATEWAY_PERCENTAGE_FEE:0.015}
  idempotency:
    ttl-seconds: ${GATEWAY_IDEMPOTENCY_TTL_SECONDS:86400}
    lock-timeout-seconds: ${GATEWAY_IDEMPOTENCY_LOCK_SECONDS:30}
  webhooks:
    delivery-enabled: ${GATEWAY_WEBHOOK_DELIVERY_ENABLED:false}
    allow-private-endpoints: ${GATEWAY_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS:false}
    max-attempts: ${GATEWAY_WEBHOOK_MAX_ATTEMPTS:5}
    poll-interval-ms: ${GATEWAY_WEBHOOK_POLL_INTERVAL_MS:2000}
    require-https: ${GATEWAY_WEBHOOK_REQUIRE_HTTPS:false}
    store-response-body: ${GATEWAY_WEBHOOK_STORE_RESPONSE_BODY:false}
    alert-provider: ${GATEWAY_WEBHOOK_ALERT_PROVIDER:mock}
    alert-poll-interval-ms: ${GATEWAY_WEBHOOK_ALERT_POLL_INTERVAL_MS:3000}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
  open-banking:
    sepay-api-key: ${SEPAY_API_KEY:}
    payos-checksum-key: ${PAYOS_CHECKSUM_KEY:}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:false}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:300}
    checkout-requests-per-minute: ${GATEWAY_RATE_LIMIT_CHECKOUT_PER_MINUTE:120}
    platform-requests-per-minute: ${GATEWAY_RATE_LIMIT_PLATFORM_PER_MINUTE:60}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} request_id=%X{requestId:-none} logger=%logger{36} message=%msg%n"

# Actuator Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
