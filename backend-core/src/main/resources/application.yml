server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-gateway-core
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        multiplier: 2.0
        max-attempts: 3

# Gateway Custom Configurations
gateway:
  fee:
    fixed-fee-vnd: ${GATEWAY_FIXED_FEE_VND:2000}
    percentage-fee: ${GATEWAY_PERCENTAGE_FEE:0.015}
  idempotency:
    ttl-seconds: ${GATEWAY_IDEMPOTENCY_TTL_SECONDS:86400}
    lock-timeout-seconds: ${GATEWAY_IDEMPOTENCY_LOCK_SECONDS:30}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
